<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>V5D Debug Test</title>
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar" id="app-sidebar">Loading sidebar...</aside>
  <main class="app-main">
    <header class="app-header" id="app-header">Loading header...</header>
    <div class="app-content" id="app-content">Loading content...</div>
  </main>
</div>
<div id="debug-log" style="position:fixed;bottom:0;left:0;right:0;height:200px;overflow:auto;background:#111;color:#0f0;font:12px monospace;padding:8px;z-index:9999"></div>
<script>
window.onerror = function(msg, url, line, col, err) {
  var log = document.getElementById('debug-log');
  log.innerHTML += '<div style="color:red">ERROR: ' + msg + ' at ' + url + ':' + line + '</div>';
  if (err && err.stack) log.innerHTML += '<div style="color:#f88;font-size:10px">' + err.stack.replace(/\n/g,'<br>') + '</div>';
};
console.log = function() {
  var log = document.getElementById('debug-log');
  var args = Array.prototype.slice.call(arguments);
  log.innerHTML += '<div>LOG: ' + args.join(' ') + '</div>';
};
console.error = function() {
  var log = document.getElementById('debug-log');
  var args = Array.prototype.slice.call(arguments);
  log.innerHTML += '<div style="color:orange">ERR: ' + args.join(' ') + '</div>';
};
console.warn = function() {
  var log = document.getElementById('debug-log');
  var args = Array.prototype.slice.call(arguments);
  log.innerHTML += '<div style="color:yellow">WARN: ' + args.join(' ') + '</div>';
};
</script>
<script src="js/services/router.js"></script>
<script src="js/services/api.js"></script>
<script src="js/services/auth.js"></script>
<script src="js/services/projects.js"></script>
<script src="js/services/ai-providers.js"></script>
<script src="js/components/ui.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/ai-config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
