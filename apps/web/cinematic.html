, "style": "title", "appear_ms": 0, "duration_ms": 2500, "color": "#D2A8FF"}, {"text": "Option A \u2014 Minimal \u2605 SELECTED", "position": "center", "style": "stat", "appear_ms": 500, "duration_ms": 3000, "color": "#56D364"}, {"text": "Option B \u2014 Premium", "position": "center", "style": "stat", "appear_ms": 1100, "duration_ms": 3000, "color": "#8B949E"}], "duration_ms": 6000, "transition": "fade"}, {"number": 7, "name": "Validation", "description": "Quality check \u2014 clearance, doors, walkways, lighting", "camera": {"position": [17.5, 30.0, -12.0], "target": [17.5, 10.0, -7.0], "fov": 50, "duration_ms": 5000}, "overlays": [{"text": "VALIDATION", "position": "top", "style": "title", "appear_ms": 0, "duration_ms": 2500, "color": "#56D364"}, {"text": "Door clearance     \u2713", "position": "center", "style": "stat", "appear_ms": 400, "duration_ms": 1200, "color": "#56D364"}, {"text": "Furniture spacing  \u2713", "position": "center", "style": "stat", "appear_ms": 900, "duration_ms": 1200, "color": "#56D364"}, {"text": "Walkways           \u2713", "position": "center", "style": "stat", "appear_ms": 1400, "duration_ms": 1200, "color": "#56D364"}, {"text": "Lighting coverage  \u2713", "position": "center", "style": "stat", "appear_ms": 1900, "duration_ms": 1200, "color": "#56D364"}, {"text": "Validation Score: 94%", "position": "bottom", "style": "badge", "appear_ms": 2500, "duration_ms": 2000, "color": "#56D364"}], "duration_ms": 5000, "transition": "fade"}, {"number": 8, "name": "Lighting Simulation", "description": "Morning \u2192 Afternoon \u2192 Sunset \u2192 Night", "camera": {"position": [17.5, 20.0, -17.0], "target": [17.5, 10.0, -7.0], "fov": 45, "duration_ms": 8000}, "overlays": [{"text": "\u2600\ufe0f MORNING", "position": "top", "style": "title", "appear_ms": 0, "duration_ms": 1800, "color": "#FFD700"}, {"text": "\ud83c\udf24 AFTERNOON", "position": "top", "style": "title", "appear_ms": 2000, "duration_ms": 1800, "color": "#FFA500"}, {"text": "\ud83c\udf05 SUNSET", "position": "top", "style": "title", "appear_ms": 4000, "duration_ms": 1800, "color": "#FF6347"}, {"text": "\ud83c\udf19 NIGHT", "position": "top", "style": "title", "appear_ms": 6000, "duration_ms": 1800, "color": "#4169E1"}], "duration_ms": 8000, "transition": "fade"}, {"number": 9, "name": "Guided Walkthrough", "description": "Tour the completed project", "camera": {"position": [17.5, 15.0, 3.0], "target": [22.5, 10.0, -7.0], "fov": 50, "duration_ms": 10000}, "overlays": [{"text": "GUIDED WALKTHROUGH", "position": "top", "style": "title", "appear_ms": 0, "duration_ms": 3000, "color": "#FFFFFF"}, {"text": "\u2192 Entrance", "position": "center", "style": "subtitle", "appear_ms": 1000, "duration_ms": 1000, "color": "#79C0FF"}, {"text": "\u2192 Workspace", "position": "center", "style": "subtitle", "appear_ms": 2200, "duration_ms": 1000, "color": "#79C0FF"}, {"text": "\u2192 Meeting Room", "position": "center", "style": "subtitle", "appear_ms": 3400, "duration_ms": 1000, "color": "#79C0FF"}], "duration_ms": 10000, "transition": "fade"}, {"number": 10, "name": "Before vs After", "description": "Original CAD \u2192 AI-Designed V2.0", "camera": {"position": [17.5, 30.0, -7.0], "target": [17.5, 10.0, -7.0], "fov": 60, "duration_ms": 6000}, "overlays": [{"text": "BEFORE  \u21c4  AFTER", "position": "top", "style": "title", "appear_ms": 0, "duration_ms": 3000, "color": "#FFFFFF"}, {"text": "Furniture: 0 \u2192 12", "position": "center", "style": "stat", "appear_ms": 500, "duration_ms": 1500, "color": "#FFA657"}, {"text": "Lights: 0 \u2192 3", "position": "center", "style": "stat", "appear_ms": 1200, "duration_ms": 1500, "color": "#FFA657"}, {"text": "Materials: default \u2192 custom palette", "position": "center", "style": "stat", "appear_ms": 1900, "duration_ms": 1500, "color": "#FFA657"}, {"text": "V1: a0fb1df2...  \u2192  V2: a45c896e...", "position": "bottom", "style": "stat", "appear_ms": 2500, "duration_ms": 2000, "color": "#8B949E"}], "duration_ms": 6000, "transition": "fade"}, {"number": 11, "name": "Project Intelligence", "description": "Statistics, cost, timeline", "camera": {"position": [17.5, 40.0, -2.0], "target": [17.5, 10.0, -2.0], "fov": 70, "duration_ms": 6000}, "overlays": [{"text": "PROJECT INTELLIGENCE", "position": "top", "style": "title", "appear_ms": 0, "duration_ms": 2500, "color": "#D2A8FF"}, {"text": "Building Area: 140 m\u00b2", "position": "center", "style": "stat", "appear_ms": 400, "duration_ms": 1500, "color": "#FFFFFF"}, {"text": "Rooms: 1  |  Furniture: 12  |  Lights: 3", "position": "center", "style": "stat", "appear_ms": 1000, "duration_ms": 1500, "color": "#8B949E"}, {"text": "Est. Cost: Standard  |  Est. Time: 14-21 days", "position": "center", "style": "stat", "appear_ms": 1600, "duration_ms": 1500, "color": "#8B949E"}, {"text": "AI Confidence: 92%  |  Validation: 94%", "position": "center", "style": "stat", "appear_ms": 2200, "duration_ms": 1500, "color": "#56D364"}, {"text": "Version: 2.0  |  Cameras: 3", "position": "bottom", "style": "stat", "appear_ms": 2800, "duration_ms": 1500, "color": "#8B949E"}], "duration_ms": 6000, "transition": "fade"}, {"number": 12, "name": "Final Reveal", "description": "Orbit around the completed project", "camera": {"position": [32.5, 20.0, 8.0], "target": [17.5, 10.0, -2.0], "fov": 55, "duration_ms": 6000}, "overlays": [{"text": "PREMIUM SCANDINAVIAN OFFICE", "position": "center", "style": "title", "appear_ms": 1000, "duration_ms": 2500, "color": "#3FB950"}, {"text": "PROJECT COMPLETE", "position": "center", "style": "subtitle", "appear_ms": 1800, "duration_ms": 1500, "color": "#FFFFFF"}, {"text": "Ready for Review  |  Ready for Sharing  |  Ready for Export", "position": "bottom", "style": "stat", "appear_ms": 2500, "duration_ms": 2000, "color": "#56D364"}, {"text": "VISION 5D", "position": "bottom", "style": "badge", "appear_ms": 3500, "duration_ms": 2000, "color": "#3FB950"}], "duration_ms": 6000, "transition": "fade"}];
const TOTAL = SCENES.length;
let currentScene = 0, playing = false, startTime = 0, sceneStart = 0;
let camera, renderer, scene, controls;

// Init Three.js
scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
scene.fog = new THREE.Fog(0x0d1117, 20, 80);

camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.5, 200);
camera.position.set(20, 12, 30);

renderer = new THREE.WebGLRenderer({canvas:document.getElementById('canvas'),antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

// Grid + ground
const grid = new THREE.GridHelper(60, 40, 0x30363d, 0x21262d);
scene.add(grid);

const groundGeom = new THREE.PlaneGeometry(80, 80);
const groundMat = new THREE.MeshStandardMaterial({color:0x1a1a2e,roughness:1});
const ground = new THREE.Mesh(groundGeom, groundMat);
ground.rotation.x = -Math.PI/2; ground.position.y = -0.5;
scene.add(ground);

// Demo building geometry
const buildGroup = new THREE.Group();
scene.add(buildGroup);

// Walls
const wallMat = new THREE.MeshStandardMaterial({color:0xf5f0e8,roughness:0.6});
for (let i = 0; i < 8; i++) {
    const angle = (i/8)*Math.PI*2;
    const x = Math.cos(angle)*12, z = Math.sin(angle)*8;
    const wall = new THREE.Mesh(new THREE.BoxGeometry(0.3,3,4), wallMat);
    wall.position.set(x, 1.5, z);
    wall.rotation.y = angle;
    buildGroup.add(wall);
}

// Floor
const floorMat = new THREE.MeshStandardMaterial({color:0xd4c4a8,roughness:0.3});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(24, 16), floorMat);
floor.rotation.x = -Math.PI/2; floor.position.y = 0.01;
buildGroup.add(floor);

// Lights
const ambient = new THREE.AmbientLight(0x404060, 0.6);
const sun = new THREE.DirectionalLight(0xfff5e6, 1.2);
sun.position.set(10, 15, 5); sun.castShadow = true;
scene.add(ambient, sun);

// Camera animation
function lerp(a,b,t){return a+(b-a)*t}
function lerpV3(a,b,t){return new THREE.Vector3(lerp(a.x,b.x,t),lerp(a.y,b.y,t),lerp(a.z,b.z,t))}

function loadScene(idx) {
    const s = SCENES[idx];
    const pos = s.camera.position, tgt = s.camera.target;
    camera.position.set(pos[0], pos[1], pos[2]);
    camera.lookAt(tgt[0], tgt[1], tgt[2]);
    camera.fov = s.camera.fov; camera.updateProjectionMatrix();
    updateOverlays(s);
    document.getElementById('scene-name').textContent = `Scene ${idx+1}/${TOTAL}: ${s.name}`;
    document.getElementById('progress-bar').style.width = `${((idx+1)/TOTAL)*100}%`;
}

function updateOverlays(s) {
    const overlay = document.getElementById('overlay');
    overlay.innerHTML = '';
    const now = Date.now() - sceneStart;
    s.overlays.forEach(o => {
        if (now >= o.appear_ms && now < o.appear_ms + o.duration_ms) {
            const el = document.createElement('div');
            el.className = `overlay-text ${o.style} ${o.position}`;
            el.textContent = o.text;
            el.style.color = o.color;
            el.style.opacity = Math.min(1, (now-o.appear_ms)/300);
            overlay.appendChild(el);
        }
    });
}

function prevScene() { currentScene = Math.max(0, currentScene-1); sceneStart = Date.now(); loadScene(currentScene); }
function nextScene() { currentScene = Math.min(TOTAL-1, currentScene+1); sceneStart = Date.now(); loadScene(currentScene); }

function togglePlay() {
    playing = !playing;
    const btn = document.getElementById('playBtn');
    if (playing) {
        btn.textContent = '⏸ PAUSE';
        startTime = Date.now();
        sceneStart = startTime;
        loadScene(currentScene);
        animate();
    } else {
        btn.textContent = '▶ WATCH REVEAL';
    }
}

function animate() {
    if (!playing) return;
    requestAnimationFrame(animate);
    const elapsed = Date.now() - startTime;
    const totalDur = SCENES.reduce((a,s)=>a+s.duration_ms, 0);
    let cumTime = 0, newScene = 0;
    for (let i = 0; i < TOTAL; i++) {
        cumTime += SCENES[i].duration_ms;
        if (elapsed >= cumTime - SCENES[i].duration_ms) newScene = i;
        if (elapsed >= totalDur) { playing = false; document.getElementById('playBtn').textContent = '🔄 REPLAY'; return; }
    }
    if (newScene !== currentScene) { currentScene = newScene; sceneStart = Date.now(); loadScene(currentScene); }
    updateOverlays(SCENES[currentScene]);
    // Orbit camera
    const t = elapsed * 0.0003;
    const r = 18 + Math.sin(t)*5;
    camera.position.x = Math.cos(t*0.7) * r;
    camera.position.z = Math.sin(t*0.7) * r * 0.6;
    camera.position.y = 8 + Math.sin(t*0.5)*4;
    camera.lookAt(0, 1.5, 0);
    renderer.render(scene, camera);
}

loadScene(0);
window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
window.prevScene = prevScene; window.nextScene = nextScene; window.togglePlay = togglePlay;
</script>
